# ─────────────────────────────────────────────────────────────
# Intégration continue : à chaque push sur main et à chaque Pull Request,
#  1. la documentation est vérifiée (fiches, parité FR/EN, liens), puis exportée en JSON ;
#  2. l'outil de vérification est testé ;
#  3. son code est analysé (style, logique, sécurité) ;
#  4. l'interface web est typée, testée sur les vrais exports, puis construite.
# ─────────────────────────────────────────────────────────────
name: Vérifications

on:
    push:
        branches: [main]
    pull_request:

# Principe du moindre privilège : le workflow peut seulement LIRE le dépôt
permissions:
    contents: read

jobs:
    # ─── La documentation est-elle cohérente ? ────────────────
    docs:
        name: Documentation · playbook-check
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Récupérer le code
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Installer Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.14"

            - name: Installer l'outil
              run: |
                  python -m pip install --upgrade pip
                  pip install -e .

            - name: Vérifier les fiches, la parité FR/EN et les liens
              run: playbook-check

            # L'export doit réussir dans les deux langues (il est refusé au moindre problème)
            - name: Exporter les actions à cocher en JSON (FR et EN)
              run: |
                  playbook-export --lang fr -o playbooks.fr.json
                  playbook-export --lang en -o playbooks.en.json

    # ─── L'outil fonctionne-t-il partout ? ────────────────────
    tests:
        name: Tests · Python ${{ matrix.python-version }} · ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 10
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                python-version: ["3.11", "3.14"]
        steps:
            - name: Récupérer le code
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Installer Python ${{ matrix.python-version }}
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Installer le projet et les outils de test
              run: |
                  python -m pip install --upgrade pip
                  pip install -e ".[dev]"

            # -X dev active les avertissements supplémentaires de Python (fichiers non fermés…)
            - name: Lancer les tests
              run: python -X dev -m pytest -v

    # ─── Qualité et sécurité du code ──────────────────────────
    quality:
        name: Qualité · ruff
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Récupérer le code
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Installer Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.14"

            - name: Installer les outils
              run: |
                  python -m pip install --upgrade pip
                  pip install -e ".[dev]"

            - name: Analyse statique
              run: ruff check --output-format github .

            - name: Formatage
              run: ruff format --check .

    # ─── L'interface web ──────────────────────────────────────
    web:
        name: Interface web · Node 24
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Récupérer le code
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Installer Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.14"

            # L'interface lit les exports JSON : on les génère depuis la documentation du commit
            - name: Générer les données de l'interface
              run: |
                  python -m pip install --upgrade pip
                  pip install -e .
                  playbook-export --lang fr -o web/data/playbooks.fr.json
                  playbook-export --lang en -o web/data/playbooks.en.json

            - name: Installer Node.js 24
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: web/package-lock.json

            # npm ci : installation exacte depuis package-lock.json, sans le modifier
            - name: Typer, tester, construire
              working-directory: web
              run: |
                  npm ci
                  npm run typecheck
                  npm test
                  npm run build
